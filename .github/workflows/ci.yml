name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository (v5.1.0)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js (v5.0.0)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.1
          cache: npm

      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Install dependencies
        run: npm ci

      - name: Verify same-machine contract
        run: npm run verify:same-machine-smoke

      - name: Verify source snapshot
        run: npm run verify:source-snapshot

      - name: Verify install simulation
        run: npm run verify:install-simulation

      - name: Verify milestone gate
        run: npm run verify:milestone
